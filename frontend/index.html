<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FastAPI Docs Copilot</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>

<style>
  :root {
    --bg: #05060f;
    --panel: rgba(16, 20, 40, 0.55);
    --cyan: #22d3ee;
    --violet: #a78bfa;
    --pink: #f472b6;
    --text: #e6ecff;
    --text-dim: #8b93b8;
    --border: rgba(120, 140, 255, 0.18);
    --glow: 0 0 24px rgba(34, 211, 238, 0.35);
    --grad: linear-gradient(135deg, var(--cyan), var(--violet) 55%, var(--pink));
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    overflow: hidden;
  }

  /* ---------- animated background ---------- */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }

  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.45;
    animation: drift 22s ease-in-out infinite alternate;
  }
  .orb.a { width: 520px; height: 520px; background: #0e7490; top: -160px; left: -140px; }
  .orb.b { width: 460px; height: 460px; background: #6d28d9; bottom: -180px; right: -120px; animation-duration: 27s; }
  .orb.c { width: 300px; height: 300px; background: #be185d; top: 40%; left: 55%; opacity: 0.25; animation-duration: 31s; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(80px, 60px) scale(1.12); }
    100% { transform: translate(-60px, 30px) scale(0.95); }
  }

  .grid {
    position: absolute;
    left: -50%; right: -50%; bottom: -10%;
    height: 55%;
    background-image:
      linear-gradient(rgba(34, 211, 238, 0.13) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34, 211, 238, 0.13) 1px, transparent 1px);
    background-size: 56px 56px;
    transform: perspective(500px) rotateX(62deg);
    transform-origin: bottom;
    mask-image: linear-gradient(to top, black 10%, transparent 85%);
    -webkit-mask-image: linear-gradient(to top, black 10%, transparent 85%);
    animation: grid-move 6s linear infinite;
  }
  @keyframes grid-move { to { background-position: 0 56px; } }

  .scanline {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
  }

  /* ---------- layout ---------- */
  #root {
    position: relative;
    z-index: 1;
    max-width: 860px;
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 0 16px;
  }

  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 4px 18px;
    border-bottom: 1px solid var(--border);
    animation: fade-down 0.7s ease both;
  }

  .logo {
    width: 42px; height: 42px; flex: none;
    border-radius: 12px;
    background: var(--grad);
    color: #05060f;
    display: grid; place-items: center;
    animation: pulse-glow 3.5s ease-in-out infinite;
  }
  .logo svg { width: 22px; height: 22px; }

  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 14px rgba(34, 211, 238, 0.35); }
    50%      { box-shadow: 0 0 30px rgba(167, 139, 250, 0.6); }
  }

  .titles { flex: 1; min-width: 0; }

  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.06em;
    margin: 0 0 3px;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink), var(--cyan));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 8s linear infinite;
  }
  @keyframes shimmer { to { background-position: 300% 0; } }

  header p { color: var(--text-dim); font-size: 13px; margin: 0; }

  .status {
    display: flex; align-items: center; gap: 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    border: 1px solid var(--border);
    background: var(--panel);
    padding: 6px 10px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; position: relative; }
  .status.online .dot { background: #34d399; }
  .status.waking .dot { background: #fbbf24; }
  .status.offline .dot { background: #f87171; }
  .status.online .dot::after, .status.waking .dot::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: inherit; animation: ping 1.6s ease-out infinite;
  }
  @keyframes ping { to { transform: scale(2.8); opacity: 0; } }

  /* ---------- chat ---------- */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 4px;
    display: flex;
    flex-direction: column;
    gap: 22px;
    scrollbar-width: thin;
    scrollbar-color: rgba(167, 139, 250, 0.35) transparent;
  }

  .hero {
    margin: auto;
    text-align: center;
    max-width: 560px;
    animation: fade-up 0.8s 0.15s ease both;
  }

  .core { width: 96px; height: 96px; margin: 0 auto 22px; position: relative; }
  .core .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: var(--cyan);
    border-right-color: var(--violet);
    animation: spin 3s linear infinite;
  }
  .core .ring.r2 { inset: 12px; border-top-color: var(--pink); border-right-color: transparent; border-left-color: var(--cyan); animation-duration: 4.5s; animation-direction: reverse; }
  .core .heart {
    position: absolute; inset: 30px; border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 0 40px rgba(34, 211, 238, 0.6);
    animation: breathe 2.8s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes breathe { 50% { transform: scale(0.82); opacity: 0.75; } }

  .hero h2 { font-family: 'Orbitron', sans-serif; font-size: 22px; letter-spacing: 0.04em; margin: 0 0 10px; }
  .hero p { color: var(--text-dim); line-height: 1.6; font-size: 15px; margin: 0 0 24px; }

  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .chip {
    font: inherit; font-size: 14px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    animation: fade-up 0.6s ease both;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--cyan); box-shadow: var(--glow); }
  .chip:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  .message-row { display: flex; gap: 12px; max-width: 88%; animation: msg-in 0.45s cubic-bezier(.2,.8,.2,1) both; }
  .message-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .message-row.assistant { align-self: flex-start; }

  @keyframes msg-in { from { opacity: 0; transform: translateY(14px) scale(0.98); } }

  .avatar {
    width: 32px; height: 32px; flex: none;
    border-radius: 10px;
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; font-weight: 500;
  }
  .assistant .avatar { background: var(--grad); color: #05060f; box-shadow: var(--glow); }
  .user .avatar { background: rgba(167, 139, 250, 0.15); border: 1px solid rgba(167, 139, 250, 0.4); color: var(--violet); }
  .avatar svg { width: 16px; height: 16px; }

  .msg-body { min-width: 0; display: flex; flex-direction: column; }
  .user .msg-body { align-items: flex-end; }

  .bubble {
    padding: 13px 16px;
    border-radius: 16px;
    line-height: 1.6;
    font-size: 15px;
    overflow-wrap: anywhere;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .user .bubble {
    background: linear-gradient(135deg, rgba(34, 211, 238, 0.22), rgba(167, 139, 250, 0.22));
    border: 1px solid rgba(34, 211, 238, 0.35);
    border-top-right-radius: 4px;
    white-space: pre-wrap;
  }

  .assistant .bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    position: relative;
  }
  .assistant .bubble::before {
    content: ""; position: absolute; left: -1px; top: 12px; bottom: 12px; width: 2px;
    background: var(--grad); border-radius: 2px;
  }

  /* markdown inside answers */
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md li::marker { color: var(--cyan); }
  .md strong { color: #fff; font-weight: 600; }
  .md a { color: var(--cyan); }
  .md h1, .md h2, .md h3 { font-size: 16px; margin: 14px 0 8px; color: var(--cyan); }
  .md code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    background: rgba(34, 211, 238, 0.1);
    color: #a5f3fc;
    padding: 1px 6px;
    border-radius: 5px;
  }
  .md pre {
    background: #03040b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    overflow-x: auto;
    margin: 0 0 10px;
  }
  .md pre code { background: none; padding: 0; color: #d6e0ff; line-height: 1.55; }

  .caret {
    display: inline-block; width: 8px; height: 1.05em;
    background: var(--cyan); margin-left: 2px; vertical-align: text-bottom;
    animation: blink 0.9s steps(2) infinite;
    box-shadow: 0 0 8px var(--cyan);
  }
  @keyframes blink { 50% { opacity: 0; } }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 9px; }

  @keyframes pop { from { opacity: 0; transform: scale(0.6); } }

  .copy-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    background: none;
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .copy-btn:hover, .copy-btn:focus-visible { color: var(--cyan); border-color: var(--border); outline: none; }

  /* typing indicator */
  .thinking { display: flex; align-items: center; gap: 12px; }
  .dots { display: flex; gap: 5px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--cyan);
    animation: bounce 1.2s ease-in-out infinite;
    box-shadow: 0 0 10px var(--cyan);
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; background: var(--violet); box-shadow: 0 0 10px var(--violet); }
  .dots span:nth-child(3) { animation-delay: 0.3s; background: var(--pink); box-shadow: 0 0 10px var(--pink); }
  @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); opacity: 0.5; } 40% { transform: translateY(-7px); opacity: 1; } }

  .thinking-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  /* ---------- error + input ---------- */
  .error-banner {
    background: rgba(248, 113, 113, 0.1);
    border: 1px solid rgba(248, 113, 113, 0.4);
    color: #fecaca;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 13px;
    margin-bottom: 10px;
    animation: shake 0.4s ease;
  }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  .input-area { padding: 6px 0 22px; }

  .input-shell {
    display: flex; gap: 8px; align-items: center;
    padding: 6px 6px 6px 18px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  .input-shell:focus-within { border-color: rgba(34, 211, 238, 0.6); box-shadow: 0 0 0 4px rgba(34, 211, 238, 0.08), var(--glow); }

  .input-shell input {
    flex: 1; min-width: 0;
    background: none; border: none; outline: none;
    color: var(--text);
    font: inherit; font-size: 15px;
    padding: 10px 0;
  }
  .input-shell input::placeholder { color: var(--text-dim); }

  .send-btn {
    width: 46px; height: 46px; flex: none;
    border: none; border-radius: 12px;
    background: var(--grad);
    color: #05060f;
    display: grid; place-items: center;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    box-shadow: var(--glow);
  }
  .send-btn svg { width: 20px; height: 20px; }
  .send-btn:hover:not(:disabled) { transform: translateY(-1px) scale(1.04); box-shadow: 0 0 32px rgba(167, 139, 250, 0.6); }
  .send-btn:active:not(:disabled) { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .send-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  .hint { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 10px; font-family: 'JetBrains Mono', monospace; opacity: 0.7; }

  @keyframes fade-up { from { opacity: 0; transform: translateY(16px); } }
  @keyframes fade-down { from { opacity: 0; transform: translateY(-12px); } }

  /* citations */
  .cite {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    font-weight: 500;
    vertical-align: super;
    line-height: 1;
    margin: 0 1px;
    padding: 2px 5px;
    border-radius: 5px;
    border: 1px solid rgba(34, 211, 238, 0.45);
    background: rgba(34, 211, 238, 0.12);
    color: #a5f3fc;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  }
  .cite:hover, .cite:focus-visible { background: var(--cyan); color: #05060f; box-shadow: var(--glow); outline: none; }

  .search-note {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    margin: 0 0 6px 2px;
  }
  .search-note::before { content: "⌕ "; color: var(--cyan); }

  .sources-panel { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }

  .source-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: rgba(5, 6, 15, 0.55);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    animation: pop 0.35s cubic-bezier(.2,1.4,.4,1) both;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .source-card.active { border-color: rgba(34, 211, 238, 0.6); box-shadow: var(--glow); }

  .source-head { display: flex; align-items: center; gap: 8px; padding: 2px 10px 2px 2px; }

  .source-toggle {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 9px;
    background: none; border: none; color: var(--text);
    font: inherit; font-size: 13px; text-align: left;
    padding: 7px 8px;
    border-radius: 10px;
    cursor: pointer;
  }
  .source-toggle:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }

  .source-num {
    flex: none;
    width: 20px; height: 20px; border-radius: 6px;
    display: grid; place-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    background: var(--grad); color: #05060f;
  }
  .source-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
  .source-file {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 2;
  }

  .source-link {
    flex: none;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--cyan); text-decoration: none;
    padding: 3px 7px; border-radius: 6px; border: 1px solid transparent;
  }
  .source-link:hover, .source-link:focus-visible { border-color: rgba(34, 211, 238, 0.4); outline: none; }

  .source-snippet {
    margin: 0 12px 12px 38px;
    padding-left: 10px;
    border-left: 2px solid var(--violet);
    font-size: 13px;
    line-height: 1.55;
    color: var(--text-dim);
    white-space: pre-wrap;
    max-height: 220px;
    overflow-y: auto;
    animation: fade-up 0.25s ease both;
  }

  .votes { display: inline-flex; gap: 2px; }
  .vote-btn {
    font-size: 13px; line-height: 1;
    background: none; border: 1px solid transparent; border-radius: 6px;
    padding: 3px 6px; cursor: pointer; opacity: 0.6;
    transition: opacity 0.2s, border-color 0.2s, transform 0.15s;
  }
  .vote-btn:hover, .vote-btn:focus-visible { opacity: 1; border-color: var(--border); outline: none; transform: scale(1.1); }
  .vote-thanks { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-dim); animation: fade-up 0.3s ease both; }
  .hint a { color: var(--cyan); text-decoration: none; }
  .hint a:hover, .hint a:focus-visible { text-decoration: underline; }

  .timings { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--text-dim); opacity: 0.8; margin-right: 4px; }

  .new-chat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .new-chat:hover:not(:disabled), .new-chat:focus-visible { border-color: var(--cyan); box-shadow: var(--glow); outline: none; }
  .new-chat:disabled { opacity: 0.4; cursor: not-allowed; }

  @media (max-width: 600px) {
    header p { display: none; }
    header h1 { font-size: 15px; }
    .message-row { max-width: 100%; }
    .avatar { display: none; }
    .hero h2 { font-size: 18px; }
    .hero p { font-size: 14px; margin-bottom: 18px; }
    .core { width: 72px; height: 72px; margin-bottom: 16px; }
    .core .ring.r2 { inset: 9px; }
    .core .heart { inset: 22px; }
    .chip { font-size: 13px; padding: 8px 14px; }
    .source-file { display: none; }
    .new-chat { padding: 6px 9px; }
    .status { padding: 6px 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="orb a"></div><div class="orb b"></div><div class="orb c"></div>
  <div class="grid"></div>
  <div class="scanline"></div>
</div>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

// The deployed backend. For local development, open the page with
// ?api=http://localhost:8000 to point it at your own server instead.
const API_URL = new URLSearchParams(location.search).get("api") || "https://rag-chatbot-s2r2.onrender.com";

const SUGGESTIONS = [
  "How do path parameters work?",
  "How do I enable CORS?",
  "What are background tasks?",
  "How do I test my app?",
];

const THINKING_STEPS = ["Understanding your question", "Searching the docs", "Ranking the best passages"];

// The server is stateless: the last few messages are sent with each
// question so follow-ups ("and what about headers?") have context.
const HISTORY_MESSAGES = 6;

const TIMING_LABELS = {
  rewrite_ms: "rewrite",
  search_ms: "search",
  rerank_ms: "rerank",
  first_token_ms: "first token",
  generate_ms: "answer",
};

marked.setOptions({ gfm: true, breaks: true });

// Markdown -> sanitized HTML, with [n] citation markers turned into
// clickable buttons - but never inside code blocks or inline code.
function renderAnswer(text, nSources) {
  // Same normalization as the backend: "【1】" / "【4†L1-L4】" -> "[1]".
  const normalized = (text || "").replace(/【\s*(\d+)[^】]*】/g, "[$1]");
  const html = DOMPurify.sanitize(marked.parse(normalized));
  return html
    .split(/(<pre[\s\S]*?<\/pre>|<code[\s\S]*?<\/code>)/g)
    .map((part, i) => i % 2 ? part : part.replace(/\[(\d+)\]/g, (match, n) =>
      Number(n) >= 1 && Number(n) <= nSources
        ? `<button class="cite" data-cite="${n}" aria-label="Show source ${n}">${n}</button>`
        : match))
    .join("");
}

function formatMs(ms) {
  return ms >= 1000 ? `${(ms / 1000).toFixed(1)}s` : `${ms}ms`;
}

// Minimal Server-Sent Events reader for a POST response (the browser's
// EventSource only supports GET).
async function* readEvents(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  while (true) {
    const { value, done } = await reader.read();
    if (done) return;
    buffer += decoder.decode(value, { stream: true });
    let end;
    while ((end = buffer.indexOf("\n\n")) !== -1) {
      const block = buffer.slice(0, end);
      buffer = buffer.slice(end + 2);
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        else if (line.startsWith("data:")) data += line.slice(5).trim();
      }
      if (data) yield { event, data: JSON.parse(data) };
    }
  }
}

const BotIcon = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4z" />
    <path d="M19 16l.8 1.9L22 19l-2.2.9L19 22l-.8-2.1L16 19l2.2-1.1z" />
  </svg>
);

const SendIcon = () => (
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6" />
  </svg>
);

function SourceCard({ source, open, onToggle }) {
  const ref = useRef(null);
  useEffect(() => {
    if (open) ref.current?.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, [open]);

  return (
    <div ref={ref} className={`source-card ${open ? "active" : ""}`}>
      <div className="source-head">
        <button className="source-toggle" onClick={onToggle} aria-expanded={open}>
          <span className="source-num">{source.id}</span>
          <span className="source-title">{source.title}</span>
          <span className="source-file">{source.source}</span>
        </button>
        {source.url && (
          <a className="source-link" href={source.url} target="_blank" rel="noopener noreferrer"
             aria-label={`Open "${source.title}" in the FastAPI docs`}>docs ↗</a>
        )}
      </div>
      {open && <div className="source-snippet">{source.snippet}</div>}
    </div>
  );
}

function AssistantMessage({ msg }) {
  const [openSource, setOpenSource] = useState(null);
  const [copied, setCopied] = useState(false);
  const [vote, setVote] = useState(null);

  function sendFeedback(rating) {
    if (vote || !msg.requestId) return;
    setVote(rating);
    fetch(`${API_URL}/feedback`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ request_id: msg.requestId, rating }),
    }).catch(() => {});
  }

  // Show the sources the answer actually cited; if it cited none (e.g. a
  // refusal), fall back to everything that was retrieved.
  const sources = msg.sources || [];
  const shown = msg.cited?.length ? sources.filter(s => msg.cited.includes(s.id)) : sources;

  function onBubbleClick(e) {
    const id = Number(e.target.closest?.("[data-cite]")?.dataset.cite);
    if (id) setOpenSource(current => current === id ? null : id);
  }

  function copy() {
    navigator.clipboard?.writeText(msg.text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  }

  const timings = Object.keys(TIMING_LABELS)
    .filter(key => msg.timings?.[key] !== undefined)
    .map(key => `${TIMING_LABELS[key]} ${formatMs(msg.timings[key])}`)
    .join(" · ");

  return (
    <div className="message-row assistant">
      <div className="avatar"><BotIcon /></div>
      <div className="msg-body">
        {msg.searchQuery && <div className="search-note">searched for “{msg.searchQuery}”</div>}
        <div className="bubble" onClick={onBubbleClick}>
          <div className="md" dangerouslySetInnerHTML={{ __html: renderAnswer(msg.text, sources.length) }} />
          {msg.streaming && <span className="caret" />}
        </div>
        {!msg.streaming && (
          <React.Fragment>
            {shown.length > 0 && (
              <div className="sources-panel">
                {shown.map(s => (
                  <SourceCard key={s.id} source={s} open={openSource === s.id}
                              onToggle={() => setOpenSource(current => current === s.id ? null : s.id)} />
                ))}
              </div>
            )}
            <div className="meta">
              {timings && <span className="timings">{timings}</span>}
              <button className="copy-btn" onClick={copy}>{copied ? "copied ✓" : "copy"}</button>
              {msg.requestId && (vote
                ? <span className="vote-thanks">thanks for the feedback!</span>
                : <span className="votes">
                    <button className="vote-btn" onClick={() => sendFeedback("up")} aria-label="Helpful answer">👍</button>
                    <button className="vote-btn" onClick={() => sendFeedback("down")} aria-label="Unhelpful answer">👎</button>
                  </span>)}
            </div>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

function Thinking({ slow }) {
  const [step, setStep] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setStep(s => (s + 1) % THINKING_STEPS.length), 1400);
    return () => clearInterval(t);
  }, []);

  return (
    <div className="message-row assistant">
      <div className="avatar"><BotIcon /></div>
      <div className="bubble thinking" role="status">
        <div className="dots"><span /><span /><span /></div>
        <span className="thinking-text">
          {slow ? "Waking up the server (free tier, ~30-60s)..." : THINKING_STEPS[step] + "..."}
        </span>
      </div>
    </div>
  );
}

function updateLast(messages, change) {
  const copy = messages.slice();
  copy[copy.length - 1] = { ...copy[copy.length - 1], ...change(copy[copy.length - 1]) };
  return copy;
}

function App() {
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState("");
  const [phase, setPhase] = useState("idle"); // idle | searching | streaming
  const [slow, setSlow] = useState(false);
  const [error, setError] = useState(null);
  const [status, setStatus] = useState("waking");
  const chatRef = useRef(null);
  const inputRef = useRef(null);
  const busy = phase !== "idle";

  // Follow the answer as it streams, unless the user scrolled up to read.
  useEffect(() => {
    const el = chatRef.current;
    if (el && el.scrollHeight - el.scrollTop - el.clientHeight < 160) el.scrollTop = el.scrollHeight;
  }, [messages]);

  useEffect(() => {
    const el = chatRef.current;
    if (el && messages.length) el.scrollTo({ top: el.scrollHeight, behavior: "smooth" });
  }, [messages.length, phase === "searching"]);

  // Ping the backend on load so the status light shows whether the
  // free-tier server is awake (and starts waking it up if it's asleep).
  useEffect(() => {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 90000);
    fetch(`${API_URL}/health`, { signal: controller.signal })
      .then(r => setStatus(r.ok ? "online" : "offline"))
      .catch(() => setStatus("offline"))
      .finally(() => clearTimeout(timer));
    return () => { clearTimeout(timer); controller.abort(); };
  }, []);

  async function sendQuestion(text) {
    const question = (text ?? input).trim();
    if (!question || busy) return;

    const history = messages
      .filter(m => m.text && !m.streaming)
      .slice(-HISTORY_MESSAGES)
      .map(m => ({ role: m.role, content: m.text }));

    setError(null);
    setMessages(prev => [...prev, { role: "user", text: question }]);
    setInput("");
    setPhase("searching");
    setSlow(false);
    const slowTimer = setTimeout(() => setSlow(true), 8000);
    let started = false;

    try {
      const res = await fetch(`${API_URL}/chat/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, history }),
      });
      if (res.status === 429) {
        const body = await res.json().catch(() => ({}));
        throw Object.assign(new Error("rate limited"), { userMessage: body.detail });
      }
      if (!res.ok || !res.body) throw new Error(`Server responded with ${res.status}`);

      for await (const { event, data } of readEvents(res)) {
        if (event === "meta") {
          started = true;
          clearTimeout(slowTimer);
          setStatus("online");
          setPhase("streaming");
          setMessages(prev => [...prev, {
            role: "assistant",
            text: "",
            sources: data.sources,
            cited: [],
            timings: data.timings,
            searchQuery: data.search_query && data.search_query !== question ? data.search_query : "",
            requestId: data.request_id,
            streaming: true,
          }]);
        } else if (event === "token") {
          setMessages(prev => updateLast(prev, m => ({ text: m.text + data.t })));
        } else if (event === "done") {
          setMessages(prev => updateLast(prev, () => ({ cited: data.cited, timings: data.timings, streaming: false })));
        } else if (event === "error") {
          throw new Error(data.message);
        }
      }
    } catch (err) {
      if (started) setMessages(prev => updateLast(prev, () => ({ streaming: false })));
      setError(err.userMessage || (started
        ? "The answer was interrupted. Please try again."
        : "Couldn't get an answer from the server. It may still be waking up, so try again in a moment."));
    } finally {
      clearTimeout(slowTimer);
      setPhase("idle");
      setTimeout(() => inputRef.current?.focus(), 0);
    }
  }

  function newChat() {
    setMessages([]);
    setError(null);
    inputRef.current?.focus();
  }

  const statusLabel = { online: "online", waking: "connecting", offline: "offline" }[status];

  return (
    <React.Fragment>
      <header>
        <div className="logo"><BotIcon /></div>
        <div className="titles">
          <h1>FASTAPI DOCS COPILOT</h1>
          <p>Answers grounded in FastAPI's official docs, with sources cited.</p>
        </div>
        {messages.length > 0 && (
          <button className="new-chat" onClick={newChat} disabled={busy}>+ new chat</button>
        )}
        <div className={`status ${status}`}><span className="dot" />{statusLabel}</div>
      </header>

      <div className="chat-area" ref={chatRef}>
        {messages.length === 0 && (
          <div className="hero">
            <div className="core"><div className="ring" /><div className="ring r2" /><div className="heart" /></div>
            <h2>Hey there! What are we building?</h2>
            <p>
              Ask me anything about FastAPI, like routing, request bodies, dependencies,
              middleware or testing. Every answer comes straight from the official docs,
              with numbered citations you can click to check.
            </p>
            <div className="chips">
              {SUGGESTIONS.map((s, i) => (
                <button key={s} className="chip" style={{ animationDelay: `${0.35 + i * 0.08}s` }} onClick={() => sendQuestion(s)}>
                  {s}
                </button>
              ))}
            </div>
          </div>
        )}

        {messages.map((m, i) =>
          m.role === "user" ? (
            <div key={i} className="message-row user">
              <div className="avatar">you</div>
              <div className="msg-body"><div className="bubble">{m.text}</div></div>
            </div>
          ) : (
            <AssistantMessage key={i} msg={m} />
          )
        )}

        {phase === "searching" && <Thinking slow={slow} />}
      </div>

      <div className="input-area">
        {error && <div className="error-banner" role="alert">{error}</div>}
        <div className="input-shell">
          <input
            ref={inputRef}
            type="text"
            placeholder={messages.length ? "Ask a follow-up..." : "Ask about FastAPI..."}
            aria-label="Your question"
            value={input}
            onChange={(e) => setInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === "Enter") { e.preventDefault(); sendQuestion(); } }}
            disabled={busy}
            maxLength={2000}
            autoFocus
          />
          <button className="send-btn" aria-label="Send" onClick={() => sendQuestion()} disabled={busy || !input.trim()}>
            <SendIcon />
          </button>
        </div>
        <div className="hint">
          Enter to send · remembers the conversation · click [n] to see a source · <a href={`stats.html${location.search}`}>live stats</a>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
