<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Copilot Stats</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@800&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #05060f;
    --surface: #0d1124;
    --panel: rgba(16, 20, 40, 0.7);
    --cyan: #22d3ee;
    --cyan-track: rgba(34, 211, 238, 0.14);
    --violet: #a78bfa;
    --pink: #f472b6;
    --warning: #fbbf24;
    --warning-track: rgba(251, 191, 36, 0.14);
    --danger: #f87171;
    --danger-track: rgba(248, 113, 113, 0.14);
    --text: #e6ecff;
    --text-dim: #8b93b8;
    --grid: rgba(120, 140, 255, 0.12);
    --border: rgba(120, 140, 255, 0.18);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 0% 0%, rgba(14, 116, 144, 0.25), transparent 60%),
      radial-gradient(800px 500px at 100% 100%, rgba(109, 40, 217, 0.22), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }

  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }

  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 20px; }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    letter-spacing: 0.06em;
    margin: 0;
    background: linear-gradient(90deg, var(--cyan), var(--violet), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { color: var(--text-dim); font-size: 13px; flex: 1; min-width: 200px; }
  a.back { color: var(--cyan); font-family: 'JetBrains Mono', monospace; font-size: 12px; text-decoration: none; }
  a.back:hover, a.back:focus-visible { text-decoration: underline; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .hero { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; }
  .hero .value { font-size: 56px; font-weight: 600; line-height: 1; }
  .hero .label { color: var(--text-dim); font-size: 14px; }
  .hero .breakdown { color: var(--text-dim); font-size: 13px; margin-left: auto; }

  .tile .label { color: var(--text-dim); font-size: 13px; margin-bottom: 6px; }
  .tile .value { font-size: 28px; font-weight: 600; }
  .tile .note { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

  h2 { font-size: 15px; font-weight: 600; margin: 28px 0 4px; }
  .section-sub { color: var(--text-dim); font-size: 13px; margin: 0 0 12px; }

  /* horizontal bar chart: one series, so no legend - the heading names it */
  .bars { display: grid; grid-template-columns: max-content 1fr; gap: 10px 12px; align-items: center; }
  .bar-label { font-size: 13px; color: var(--text-dim); }
  .bar-track { position: relative; height: 22px; border-left: 1px solid var(--grid); }
  .bar {
    height: 100%;
    background: var(--cyan);
    border-radius: 0 4px 4px 0;   /* rounded data-end, square at the baseline */
    min-width: 2px;
    transition: width 0.5s ease;
  }
  .bar-value {
    position: absolute; top: 50%; transform: translateY(-50%);
    font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text);
    padding-left: 8px; white-space: nowrap;
  }
  .bar-hit { position: absolute; inset: -4px 0; cursor: default; }

  .tooltip {
    position: fixed; pointer-events: none; z-index: 10;
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; color: var(--text);
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
    opacity: 0; transition: opacity 0.12s;
  }

  /* quota meters: fill carries severity, track is a lighter step of the same hue */
  .meter-row { margin-bottom: 14px; }
  .meter-head { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; margin-bottom: 6px; }
  .meter-head .model { font-family: 'JetBrains Mono', monospace; font-size: 12px; }
  .meter-head .used { color: var(--text-dim); white-space: nowrap; }
  .meter { height: 10px; border-radius: 5px; background: var(--cyan-track); overflow: hidden; }
  .meter > div { height: 100%; border-radius: 5px; background: var(--cyan); transition: width 0.5s ease; }
  .meter.warning { background: var(--warning-track); }
  .meter.warning > div { background: var(--warning); }
  .meter.danger { background: var(--danger-track); }
  .meter.danger > div { background: var(--danger); }
  .status-text { font-size: 12px; margin-left: 6px; color: var(--text); }

  details { margin-top: 12px; }
  summary { cursor: pointer; color: var(--text-dim); font-size: 12px; font-family: 'JetBrains Mono', monospace; }
  summary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  table { border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 4px 16px 4px 0; border-bottom: 1px solid var(--grid); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-family: 'JetBrains Mono', monospace; }
  th { color: var(--text-dim); font-weight: 500; }

  .empty, .error { color: var(--text-dim); font-size: 14px; padding: 8px 0; }
  .error { color: #fecaca; }

  footer { margin-top: 28px; color: var(--text-dim); font-size: 12px; line-height: 1.6; }
  .updated { font-family: 'JetBrains Mono', monospace; }

  @media (prefers-reduced-motion: reduce) {
    .bar, .meter > div, .tooltip { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>COPILOT STATS</h1>
    <span class="sub">Live health of the chatbot over the last 24 hours</span>
    <a class="back" href="index.html">← back to chat</a>
  </header>

  <div id="content"><p class="empty">Loading stats…</p></div>

  <footer>
    Updated <span class="updated" id="updated">–</span> · refreshes every 15 s.
    Numbers cover requests since the server last started (free-tier servers sleep when idle).
    Question text is never recorded.
  </footer>
</main>

<div class="tooltip" id="tooltip" role="tooltip"></div>

<script>
// Same backend as the chat page; ?api=http://localhost:8000 for local development.
const API_URL = new URLSearchParams(location.search).get("api") || "https://rag-chatbot-s2r2.onrender.com";

const STAGE_LABELS = {
  guard_ms: "Injection check",
  rewrite_ms: "Follow-up rewrite",
  search_ms: "Hybrid search",
  rerank_ms: "Rerank",
  first_token_ms: "First token",
  generate_ms: "Full answer",
};
const KIND_LABELS = { rag: "answered", smalltalk: "small talk", blocked: "blocked", unknown: "other" };

const fmtMs = ms => ms == null ? "–" : ms >= 1000 ? `${(ms / 1000).toFixed(1)} s` : `${ms} ms`;
const fmtPct = x => x == null ? "–" : `${Math.round(x * 100)}%`;
const fmtNum = n => n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}K` : String(n);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tile(label, value, note = "") {
  return `<div class="card tile"><div class="label">${label}</div><div class="value">${value}</div>${note ? `<div class="note">${note}</div>` : ""}</div>`;
}

function render(s) {
  const r = s.requests;
  const kinds = Object.entries(r.by_kind).map(([k, n]) => `${n} ${KIND_LABELS[k] || k}`).join(" · ") || "no requests yet";
  const fb = s.feedback;
  const votes = fb.up + fb.down;

  const stages = Object.entries(s.latency_ms.stages_p50).filter(([, ms]) => ms != null);
  const maxMs = Math.max(1, ...stages.map(([, ms]) => ms));

  const bars = stages.length ? `
    <div class="bars">
      ${stages.map(([key, ms]) => `
        <div class="bar-label">${STAGE_LABELS[key] || key}</div>
        <div class="bar-track">
          <div class="bar" style="width:${(ms / maxMs) * 82}%"></div>
          <span class="bar-value" style="left:${(ms / maxMs) * 82}%">${fmtMs(ms)}</span>
          <div class="bar-hit" data-tip="${STAGE_LABELS[key] || key}: median ${fmtMs(ms)}"></div>
        </div>`).join("")}
    </div>
    <details>
      <summary>View as table</summary>
      <table>
        <thead><tr><th>Stage</th><th>Median</th></tr></thead>
        <tbody>${stages.map(([key, ms]) => `<tr><td>${STAGE_LABELS[key] || key}</td><td class="num">${fmtMs(ms)}</td></tr>`).join("")}</tbody>
      </table>
    </details>` : `<p class="empty">No answered questions yet.</p>`;

  const meters = s.tokens.length ? s.tokens.map(t => {
    const level = t.share >= 0.9 ? "danger" : t.share >= 0.7 ? "warning" : "";
    const status = level === "danger" ? "⛔ nearly exhausted" : level === "warning" ? "⚠ running low" : "";
    return `
      <div class="meter-row">
        <div class="meter-head">
          <span class="model">${esc(t.model)}${status ? `<span class="status-text">${status}</span>` : ""}</span>
          <span class="used">${fmtNum(t.used)} / ${fmtNum(t.daily_limit)} tokens · ${fmtPct(t.share)}</span>
        </div>
        <div class="meter ${level}" role="meter" aria-valuemin="0" aria-valuemax="${t.daily_limit}" aria-valuenow="${t.used}"
             aria-label="${esc(t.model)} daily token usage">
          <div style="width:${Math.min(100, t.share * 100)}%"></div>
        </div>
      </div>`;
  }).join("") : `<p class="empty">No model calls yet.</p>`;

  document.getElementById("content").innerHTML = `
    <div class="grid">
      <div class="card hero">
        <div><div class="value">${fmtNum(r.total)}</div><div class="label">requests in the last 24 hours</div></div>
        <div class="breakdown">${kinds}</div>
      </div>
      ${tile("Median response time", fmtMs(s.latency_ms.total_p50), `90th percentile ${fmtMs(s.latency_ms.total_p90)}`)}
      ${tile("User satisfaction", fmtPct(fb.satisfaction), votes ? `👍 ${fb.up} · 👎 ${fb.down}` : "no votes yet")}
      ${tile("Answers with citations", fmtPct(s.quality.answers_with_citations), "share of answered questions")}
      ${tile("Rerank fallbacks", fmtPct(s.quality.rerank_fallback_rate), `${s.quality.llm_fallbacks} model quota fallbacks`)}
      ${tile("Blocked injections", fmtNum(r.by_kind.blocked || 0), "caught by Llama Prompt Guard")}
      ${tile("Rate-limited", fmtNum(r.rate_limited), `${r.errors} errors`)}
    </div>

    <h2>Where the time goes</h2>
    <p class="section-sub">Median time per pipeline stage for answered questions</p>
    <div class="card">${bars}</div>

    <h2>Daily token quota</h2>
    <p class="section-sub">Groq's free tier limits each model separately; the bot falls back to another model when one runs out</p>
    <div class="card">${meters}</div>
  `;
}

const tooltip = document.getElementById("tooltip");
document.addEventListener("mousemove", e => {
  const tip = e.target.closest?.("[data-tip]")?.dataset.tip;
  tooltip.style.opacity = tip ? 1 : 0;
  if (tip) {
    tooltip.textContent = tip;
    tooltip.style.left = `${Math.min(e.clientX + 12, innerWidth - tooltip.offsetWidth - 8)}px`;
    tooltip.style.top = `${e.clientY + 14}px`;
  }
});

async function load() {
  try {
    const res = await fetch(`${API_URL}/stats`);
    if (!res.ok) throw new Error(res.status);
    render(await res.json());
    document.getElementById("updated").textContent = new Date().toLocaleTimeString();
  } catch {
    document.getElementById("content").innerHTML =
      `<p class="error">Couldn't load stats. The server may be waking up, so this will retry shortly.</p>`;
  }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
